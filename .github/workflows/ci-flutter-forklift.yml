name: ci-flutter-forklift

on:
  pull_request:
    paths:
      - 'forklift/**'
      - '.github/workflows/ci-flutter-forklift.yml'
  push:
    branches: [main]
    paths:
      - 'forklift/**'
      - '.github/workflows/ci-flutter-forklift.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: forklift
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: '3.41.5'
          channel: 'stable'
          cache: true

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows (debug)
        run: flutter build windows --debug
