name: ci-db

on:
  pull_request:
    paths:
      - 'db/**'
      - '.github/workflows/ci-db.yml'
  push:
    branches: [main]
    paths:
      - 'db/**'
      - '.github/workflows/ci-db.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned versions — bump deliberately; floating versions break main retroactively.
  DBMATE_VERSION: 'v2.21.0'
  SQLFLUFF_VERSION: '3.0.7'

jobs:
  lint-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: rtg
          POSTGRES_PASSWORD: rtg
          POSTGRES_DB: rtg
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rtg"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://rtg:rtg@localhost:5432/rtg?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (for sqlfluff)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sqlfluff (pinned)
        run: pip install "sqlfluff==${{ env.SQLFLUFF_VERSION }}"

      - name: SQL lint
        run: |
          if compgen -G "db/migrations/*.sql" > /dev/null; then
            sqlfluff lint --dialect postgres db/migrations/
          else
            echo "No migration files yet — skipping lint"
          fi

      - name: Install dbmate (pinned)
        run: |
          sudo curl -fsSL -o /usr/local/bin/dbmate \
            "https://github.com/amacneil/dbmate/releases/download/${DBMATE_VERSION}/dbmate-linux-amd64"
          sudo chmod +x /usr/local/bin/dbmate
          dbmate --version

      - name: Wait for postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U rtg; then
              echo "PG ready"
              break
            fi
            sleep 1
          done
          pg_isready -h localhost -p 5432 -U rtg

      - name: Apply migrations (dbmate up)
        run: dbmate up

      - name: Verify migration reversibility (rollback all → up)
        run: |
          if compgen -G "db/migrations/*.sql" > /dev/null; then
            # Rollback ALL applied migrations, not just the most recent.
            # dbmate's `rollback` only reverses one at a time.
            for i in {1..50}; do
              applied=$(dbmate status 2>/dev/null | grep -c '\[X\]' || true)
              if [ "$applied" = "0" ]; then break; fi
              dbmate rollback || break
            done
            dbmate up
          else
            echo "No migrations to reverse — skipping"
          fi
