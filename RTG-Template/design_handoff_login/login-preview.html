<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<title>RTG · Login — Preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0f172a; font-family: "Heebo", system-ui, sans-serif; overflow: hidden; }
  * { box-sizing: border-box; }
  #stage {
    width: 100vw; height: 100vh;
    display: grid; place-items: center;
  }
  #frame {
    width: 1920px; height: 1080px;
    background: #fff;
    transform-origin: center center;
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="stage">
  <div id="frame"><div id="root" style="width:100%;height:100%"></div></div>
</div>

<script type="text/babel" src="modern-login.jsx"></script>
<script type="text/babel" data-presets="react">
  ReactDOM.createRoot(document.getElementById('root')).render(<ModernLogin />);

  // Fit 1920x1080 into any viewport
  function fit() {
    const f = document.getElementById('frame');
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    f.style.transform = `scale(${s})`;
  }
  fit(); window.addEventListener('resize', fit);
</script>
</body>
</html>
